<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recall — второй мозг</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Recall</h1>
        <div id="stats" class="stats">загрузка…</div>
        <nav class="tabs">
            <button class="tab active" data-tab="chat">Чат</button>
            <button class="tab" data-tab="search">Поиск</button>
        </nav>
    </header>

    <!-- Вкладка «Чат»: сайдбар с документами + переписка -->
    <main id="view-chat">
        <aside>
            <div id="drop" class="drop">
                Перетащите файлы сюда<br><small>или нажмите, чтобы выбрать</small>
                <input type="file" id="file" multiple
                    accept=".txt,.md,.html,.json,.go,.py,.js,.rs,.c,.cpp,.h,.java,.yaml,.yml,.csv,.log,.pdf,.docx">
            </div>
            <h2>Документы</h2>
            <ul id="docs"></ul>
        </aside>
        <section id="chatpane">
            <div id="chat"></div>
            <form id="ask">
                <textarea id="q" rows="2" placeholder="Спросите что-нибудь по своим документам…"></textarea>
                <button id="send" type="submit">Спросить</button>
                <button id="stop" type="button" hidden>Стоп</button>
            </form>
        </section>
    </main>

    <!-- Вкладка «Поиск»: сырые результаты ретривера с полосками релевантности -->
    <main id="view-search" hidden>
        <section class="searchwrap">
            <div class="searchbar">
                <input id="sq" placeholder="Поиск по чанкам документов…">
                <button id="sbtn">Найти</button>
            </div>
            <div id="results"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
