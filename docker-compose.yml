services:
  recall:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Контейнер не видит localhost хоста! Ollama крутится на машине,
      # поэтому адрес — host.docker.internal (на Windows/Mac работает
      # из коробки; на Linux понадобится extra_hosts, добавил ниже).
      RC_LLM_URL: http://host.docker.internal:11434
      RC_DB_PATH: /app/data/recall.db
    volumes:
      - ./data:/app/data   # база переживает пересоздание контейнера
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
