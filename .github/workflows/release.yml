name: Release
on:
    push:
        tags: ["v*"]

# Разрешение на создание релиза и загрузку файлов в него.
permissions:
    contents: write
    packages: write

jobs:
    binaries:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - {
                          goos: windows,
                          goarch: amd64,
                          ext: ".exe",
                          name: windows-amd64,
                      }
                    - { goos: linux, goarch: amd64, ext: "", name: linux-amd64 }
                    - { goos: linux, goarch: arm64, ext: "", name: linux-arm64 }
                    - {
                          goos: darwin,
                          goarch: arm64,
                          ext: "",
                          name: macos-arm64,
                      }
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: "1.27"
                  cache: true

            # Перед релизом гоняем тот же контроль качества, что и в CI:
            # тег с зелёными тестами не должен быть нужен «на удачу».
            - run: go vet ./... && go test ./...

            # Кросс-компиляция: из Linux собираем под все платформы сразу.
            # CGO_ENABLED=0 — статический бинарник, работает без зависимостей.
            - name: Build
              env:
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
              run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o recall${{ matrix.ext }} ./cmd/recall

            # Архив: бинарник + лицензия + README — пользователь скачивает самодостаточный zip.
            - name: Package
              run: |
                  mkdir -p dist
                  zip -9 dist/recall-${{ matrix.name }}${{ matrix.ext }}.zip recall${{ matrix.ext }} LICENSE README.md

            - uses: actions/upload-artifact@v4
              with:
                  name: recall-${{ matrix.name }}
                  path: dist/*

    docker:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            # Логин в реестр GitHub по встроенному токену — никаких секретов руками.
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/metadata-action@v5
              id: meta
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      latest
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}

    release:
        needs: [binaries]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true
            - uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true # GitHub сам соберёт changelog из коммитов
                  files: dist/*.zip
