name: CI
on:
    push:
        branches: [main]
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: "1.27"
                  cache: true # кеш модулей: сборка с холодного старта за секунды
            - run: go vet ./... # статический анализ: ловит то, что глаз пропустит
            - run: go test ./... -race # детектор гонок — наш конвейер многопоточный
            - run: go build ./...
